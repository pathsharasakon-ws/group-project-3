<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OCCASION - Lookbook Detail</title>

  <!-- Google Fonts (Prompt) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../output.css" />
</head>

<body class="bg-background font-sans min-h-screen flex flex-col justify-between text-gray-800 overflow-x-hidden">

  <!-- ================= NAVBAR ================= -->
   <header id="navbar-container"></header>

  <!-- ================= MAIN CONTENT ================= -->
  <main class="flex-grow max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-10 w-full">
    
    <div class="mb-6">
      <a href="../lookbook.html" class="inline-flex items-center text-sm font-medium text-primary hover:underline">
        &larr; กลับสู่หน้า Lookbook ทั้งหมด
      </a>
    </div>

    <h1 class="text-2xl sm:text-3xl font-extrabold text-primary mb-8">Occasion Look Detail</h1>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
        
      <!-- ฝั่งซ้าย: รูปภาพหลัก -->
      <section class="lg:col-span-5 bg-white rounded-2xl shadow-sm border border-gray-200 p-4">
        <div class="w-full aspect-[3/4] bg-white rounded-xl overflow-hidden flex items-center justify-center">
          <img id="lookImage" src="" alt="Look Image" class="w-full h-full object-contain object-center">
        </div>
        <div class="mt-4">
          <span id="lookId" class="text-xs font-bold text-accent bg-accent/10 px-3 py-1 rounded-full uppercase tracking-wider">LK000</span>
          <h2 id="lookName" class="text-xl font-bold text-gray-900 mt-2"></h2>
          <p id="lookCategory" class="text-sm text-gray-600 mt-1"></p>
        </div>
      </section>

      <!-- ฝั่งขวา: รายการสินค้า -->
      <section class="lg:col-span-7 flex flex-col gap-6">
            
        <!-- 1. ท่อนบน (Tops Item) -->
        <article class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6">
          <header class="flex items-center justify-between mb-4 pb-2 border-b border-gray-100">
            <span class="text-xs font-bold text-primary bg-primary/10 px-2.5 py-1 rounded">TOPS ITEM</span>
            <div id="topStatusContainer" class="flex flex-wrap gap-1.5 justify-end"></div>
          </header>
          <div class="flex flex-col sm:flex-row gap-4 items-start sm:items-center justify-between">
            <div class="flex items-center gap-4">
              <div class="w-20 h-20 bg-gray-50 rounded-xl overflow-hidden border flex items-center justify-center">
                <img id="topThumb" src="" alt="Top" class="w-full h-full object-contain">
              </div>
              <div>
                <h3 id="topName" class="font-bold text-gray-900 text-base"></h3>
                <a id="topDetailLink" href="#" class="text-xs font-semibold text-primary hover:underline">ดูรายละเอียด &rarr;</a>
              </div>
            </div>
            <div class="text-right">
              <span id="topPrice" class="block text-lg font-bold text-primary">0.00 บาท</span>
              <span class="text-xs text-gray-400">ราคาแยกชิ้น</span>
            </div>
          </div>
          <footer class="mt-4 pt-3 border-t flex flex-wrap items-center justify-between gap-2">
            <div class="flex items-center gap-2">
              <span class="text-xs font-semibold text-gray-600">ไซส์:</span>
              <div id="topSizeContainer" class="flex gap-1.5 flex-wrap"></div>
            </div>
            <span id="topSizeAlert" class="text-xs text-red-500 hidden">ไซส์นี้หมด</span>
          </footer>
        </article>

        <!-- 2. ท่อนล่าง ชิ้นที่ 1 -->
        <article class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6">
          <header class="flex items-center justify-between mb-4 pb-2 border-b border-gray-100">
            <span class="text-xs font-bold text-accent bg-accent/10 px-2.5 py-1 rounded">BOTTOM 1</span>
            <div id="bottom1StatusContainer" class="flex flex-wrap gap-1.5 justify-end"></div>
          </header>
          <div class="flex flex-col sm:flex-row gap-4 items-start sm:items-center justify-between">
            <div class="flex items-center gap-4">
              <div class="w-20 h-20 bg-gray-50 rounded-xl overflow-hidden border flex items-center justify-center">
                <img id="bottom1Thumb" src="" alt="Bottom 1" class="w-full h-full object-contain">
              </div>
              <div>
                <h3 id="bottom1Name" class="font-bold text-gray-900 text-base"></h3>
                <a id="bottom1DetailLink" href="#" class="text-xs font-semibold text-primary hover:underline">ดูรายละเอียด &rarr;</a>
              </div>
            </div>
            <div class="text-right">
              <span id="bottom1Price" class="block text-lg font-bold text-primary">0.00 บาท</span>
              <span class="text-xs text-gray-400">ราคาแยกชิ้น</span>
            </div>
          </div>
          <footer class="mt-4 pt-3 border-t flex flex-wrap items-center justify-between gap-2">
            <div class="flex items-center gap-2">
              <span class="text-xs font-semibold text-gray-600">ไซส์:</span>
              <div id="bottom1SizeContainer" class="flex gap-1.5 flex-wrap"></div>
            </div>
            <span id="bottom1SizeAlert" class="text-xs text-red-500 hidden">ไซส์นี้หมด</span>
          </footer>
        </article>

        <!-- 3. ท่อนล่าง ชิ้นที่ 2 -->
        <article id="bottom2Wrapper" class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6 hidden">
          <header class="flex items-center justify-between mb-4 pb-2 border-b border-gray-100">
            <span class="text-xs font-bold text-secondary bg-secondary/10 px-2.5 py-1 rounded">BOTTOM 2</span>
            <div id="bottom2StatusContainer" class="flex flex-wrap gap-1.5 justify-end"></div>
          </header>
          <div class="flex flex-col sm:flex-row gap-4 items-start sm:items-center justify-between">
            <div class="flex items-center gap-4">
              <div class="w-20 h-20 bg-gray-50 rounded-xl overflow-hidden border flex items-center justify-center">
                <img id="bottom2Thumb" src="" alt="Bottom 2" class="w-full h-full object-contain">
              </div>
              <div>
                <h3 id="bottom2Name" class="font-bold text-gray-900 text-base"></h3>
                <a id="bottom2DetailLink" href="#" class="text-xs font-semibold text-primary hover:underline">ดูรายละเอียด &rarr;</a>
              </div>
            </div>
            <div class="text-right">
              <span id="bottom2Price" class="block text-lg font-bold text-primary">0.00 บาท</span>
              <span class="text-xs text-gray-400">ราคาแยกชิ้น</span>
            </div>
          </div>
          <footer class="mt-4 pt-3 border-t flex flex-wrap items-center justify-between gap-2">
            <div class="flex items-center gap-2">
              <span class="text-xs font-semibold text-gray-600">ไซส์:</span>
              <div id="bottom2SizeContainer" class="flex gap-1.5 flex-wrap"></div>
            </div>
            <span id="bottom2SizeAlert" class="text-xs text-red-500 hidden">ไซส์นี้หมด</span>
          </footer>
        </article>

        <!-- สรุปราคา -->
        <section class="hidden md:flex bg-white rounded-2xl shadow-sm border p-6 flex-col sm:flex-row items-center justify-between gap-4">
          <div>
            <p class="text-xs text-gray-500">ราคารวมทั้งเซ็ต</p>
            <p id="totalPrice" class="text-2xl font-extrabold text-primary">0.00 บาท</p>
          </div>
          <button id="addToCartBtn" onclick="addLookToCart()" class="w-full sm:w-auto bg-accent text-white font-bold py-3.5 px-8 rounded-xl shadow hover:bg-opacity-90 transition">
            เพิ่มลงตะกร้า
          </button>
        </section>
      </section>
    </div>
  </main>

 <div id="footer-container"></div>

  <script type="module" src="./js/detail.js"></script>
  <script type="module" src="../script.js"></script>

</body>
</html>
