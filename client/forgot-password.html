<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - OCCASION</title>

  <!-- Google Fonts (Prompt) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./output.css" />


</head>

<body class="bg-background font-sans min-h-screen flex flex-col justify-between text-gray-800">

  <!-- ================= NAVBAR ================= -->
  <header id="navbar-container"></header>

  <!-- ================= MAIN CONTENT: FORGOT PASSWORD ================= -->
  <main class="flex-grow flex items-center justify-center py-12 px-4">
    <div class="bg-white p-8 sm:p-10 rounded-xl shadow-sm max-w-md w-full">
      
      <!-- Icon แม่กุญแจ -->
      <div class="flex justify-center mb-4">
        <div class="w-16 h-16 rounded-full bg-pink-50 flex items-center justify-center text-[#e2156d]">
          <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
          </svg>
        </div>
      </div>

      <h1 class="text-2xl font-bold text-center mb-2 text-gray-900">Forgot Password?</h1>
      <p class="text-xs text-gray-500 text-center mb-6 leading-relaxed">
        Enter your email address and we'll send you a link to reset your password.
      </p>

      <!-- FORM FORGOT PASSWORD -->
      <form action="./forgot-password-sent.html" class="space-y-5">
        <!-- Email Input -->
        <div class="relative">
          <label class="absolute -top-2.5 left-3 bg-white px-1 text-xs text-gray-500">Email Address</label>
          <input type="email" required placeholder="youremail@example.com" class="w-full border border-gray-300 rounded-md px-3 py-2.5 text-sm focus:outline-none focus:border-gray-500" />
        </div>

        <!-- ปุ่ม Reset Password -->
        <button type="submit" class="w-full text-white text-center py-3.5 rounded-full font-semibold block transition-all duration-300 relative overflow-hidden backdrop-blur-md bg-[#e2156d]/70 border border-white/30 shadow-[0_8px_32px_0_rgba(226,21,109,0.37)] hover:bg-[#e2156d]/90 hover:shadow-[0_8px_32px_0_rgba(226,21,109,0.6)] hover:scale-[1.02] active:scale-[0.98] before:absolute before:inset-0 before:bg-gradient-to-br before:from-white/40 before:to-transparent before:opacity-50 pointer-events-auto">
        <span class="relative z-10">Send Reset Link</span>
        </button>
      </form>

      <!-- Back to Login -->
      <div class="mt-6 text-center">
        <a href="./log-in.html" class="text-xs text-gray-500 hover:text-gray-800 inline-flex items-center gap-1 transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
          </svg>
          <span>Back to Sign In</span>
        </a>
      </div>

    </div>
  </main>

<div id="footer-container"></div>

  <script type="module" src="./script.js"></script>

</body>
</html>
