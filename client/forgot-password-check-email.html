<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Check Your Email - OCCASION</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./output.css" />

</head>
<body class="bg-background font-sans min-h-screen flex flex-col justify-between text-gray-800">

  <!-- ================= NAVBAR ================= -->
  <header id="navbar-container"></header>

  <!-- MAIN CONTENT -->
  <main class="flex-grow flex items-center justify-center py-12 px-4">
    <div class="bg-white p-8 sm:p-10 rounded-2xl shadow-sm max-w-md w-full flex flex-col items-center text-center">
      
      <!-- Email Icon -->
      <div class="w-20 h-20 rounded-full border-4 border-[#e2156d] flex items-center justify-center mb-6">
        <svg class="w-10 h-10 text-[#e2156d]" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
        </svg>
      </div>

      <h1 class="text-3xl font-extrabold text-gray-900 mb-2">Check Your Email</h1>
      <p class="text-gray-500 text-sm mb-8">
        We have sent a password reset link to your email address. Please check your inbox.
      </p>

      <!-- Demo Link To Reset Page -->
      <a href="./reset-password.html" class="w-full text-white text-center py-3.5 rounded-full font-semibold block transition-all duration-300 relative overflow-hidden backdrop-blur-md bg-[#e2156d]/70 border border-white/30 shadow-[0_8px_32px_0_rgba(226,21,109,0.37)] hover:bg-[#e2156d]/90 hover:shadow-[0_8px_32px_0_rgba(226,21,109,0.6)] hover:scale-[1.02] active:scale-[0.98] before:absolute before:inset-0 before:bg-gradient-to-br before:from-white/40 before:to-transparent before:opacity-50 pointer-events-auto">
        <span class="relative z-10">Reset Password</span>
      </a>

      <p class="text-xs text-gray-400">
        Didn't receive the email? <a href="./forgot-password.html" class="text-blue-600 underline">Resend link</a>
      </p>

    </div>
  </main>

<div id="footer-container"></div>

  <script type="module" src="./script.js"></script>

</body>
</html>
