<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In - OCCASION</title>

  <!-- Google Fonts (Prompt) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./output.css" />
</head>

<body class="bg-background font-sans min-h-screen flex flex-col justify-between text-secondary">

  <!-- ================= NAVBAR ================= -->
  <header id="navbar-container"></header>

  <!-- ================= MAIN CONTENT ================= -->
  <main class="flex-grow flex items-center justify-center p-4 py-8">
    <div class="w-full max-w-4xl grid grid-cols-1 md:grid-cols-2 rounded-3xl overflow-hidden shadow-xl bg-white min-h-[520px] animate-fade-in-up">
      
      <!-- Left Side Banner (Logo Area) -->
      <div class="bg-white relative flex items-center justify-center p-8 overflow-hidden">
        
        <!-- LOGO PART (นี่คือส่วนที่จำลองโลโก้ครับ ในงานจริงควรใช้ไฟล์รูปภาพ) -->
        <div class="z-10 w-full max-w-[300px]">
          
          <img src="./assets/logo/newlogo.png" alt="OCCASION Logo" class="w-full h-auto">
            
            <!-- Icons Top ( Martini Glass & Cake ) -->
            <g transform="translate(145, 10) scale(0.9)">
              <!-- Pin Left -->
              <path d="M25 0 C22 0 20 4 20 8 C20 12 25 22 25 22 C25 22 30 12 30 8 C30 4 28 0 25 0 Z" fill="#E25822" />
              <!-- Cake Center -->
              <path d="M50 8 H66 V16 H50 Z M48 16 H68 V22 H48 Z" fill="#E25822" />
              <rect x="57" y="2" width="2" height="6" fill="#E25822" />
              <!-- Tie/Glass Right -->
              <path d="M88 0 L94 12 L88 22 L82 12 Z" fill="#E25822" />
            </g>

            <!-- Bottom Curve Line (Orange) -->
            <path d="M40 125 C140 145 260 145 360 125" stroke="#E25822" stroke-width="5" stroke-linecap="round" fill="none" />
          </svg>
        </div>

      </div>

      <!-- Right Side Form (Rest unchanged) -->
      <div class="relative flex flex-col justify-center px-8 py-10 md:px-12 bg-white border-l border-gray-100">
        
        <h2 class="text-2xl md:text-3xl font-bold text-primary text-center mb-8">Great to see you again!</h2>

        <form class="space-y-6">
          <!-- User Name Input -->
          <div>
            <input 
              type="text" 
              placeholder="User Name" 
              class="w-full border-b-2 border-gray-200 py-2.5 text-secondary focus:outline-none focus:border-primary transition-colors placeholder-gray-400"
              required
            />
          </div>

          <!-- Password Input -->
          <div class="relative">
            <input 
              type="password" 
              placeholder="Password" 
              class="w-full border-b-2 border-gray-200 py-2.5 pr-8 text-secondary focus:outline-none focus:border-primary transition-colors placeholder-gray-400"
              required
            />
            <!-- Hide/Show Password Icon -->
            <button type="button" class="absolute right-0 top-3 text-gray-400 hover:text-primary transition-colors focus:outline-none">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 9.9a3 3 0 104.24 4.24M1 1l22 22" />
              </svg>
            </button>
          </div>

          <!-- Submit Button -->
          <button 
            type="submit" 
            class="w-full bg-primary hover:bg-opacity-90 text-white font-medium py-3 rounded-xl transition-all shadow-md active:scale-[0.99]"
          >
            Login
          </button>
        </form>

        <!-- Footer Links -->
        <div class="flex flex-col sm:flex-row justify-between items-center text-xs mt-6 text-secondary gap-2">
          <a href="./forgot-password.html" class="hover:text-primary transition-colors">Forgot Password?</a>
          <div>
            <span>Don't have an account? </span>
            <a href="./signup.html" class="text-accent font-semibold hover:underline">Get Started</a>
          </div>
        </div>

      </div>
    </div>
  </main>

  <!-- ================= FOOTER ================= -->
  <div id="footer-container"></div>

  <script type="module" src="./script.js"></script>
</body>
</html>
