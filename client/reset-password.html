<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - OCCASION</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { primary: "#0046a7", secondary: "#495f8f", accent: "#e2156d", background: "#fcf4ee" },
          fontFamily: { sans: ["Prompt", "sans-serif"] },
        },
      },
    }
  </script>
</head>
<body class="bg-background font-sans min-h-screen flex flex-col justify-between text-gray-800">

  <!-- NAVBAR -->
  <nav class="w-full bg-white shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between h-20">
      <a href="./index.html"><img src="./assets/newlogo.png" alt="Logo" class="w-24 h-auto" /></a>
      <ul class="flex items-center gap-6 text-lg font-medium">
        <li><button class="rounded-full border border-gray-400 p-2"><img src="./assets/search.png" alt="search" class="w-4 h-4" /></button></li>
        <li class="text-primary decoration-accent hover:underline underline-offset-4"><a href="./index.html">PRODUCTS</a></li>
        <li class="text-primary decoration-accent hover:underline underline-offset-4"><a href="#">FEATURES</a></li>
        <li><a href="./index.html" class="flex items-center gap-2 text-primary"><img src="./assets/user.png" alt="Sign in" class="w-6 h-6" /><span>SIGN IN</span></a></li>
        <li><a href="#"><img src="./assets/cartBag.png" alt="Cart" class="w-6 h-6" /></a></li>
      </ul>
    </div>
  </nav>

  <!-- MAIN CONTENT -->
  <main class="flex-grow flex items-center justify-center py-12 px-4">
    <div class="bg-white p-8 sm:p-10 rounded-xl shadow-sm max-w-md w-full">
      
      <h1 class="text-2xl font-bold text-center mb-2 text-gray-900">Set New Password</h1>
      <p class="text-xs text-gray-500 text-center mb-6 leading-relaxed">
        Your new password must be different from previously used passwords.
      </p>

      <!-- FORM RESET PASSWORD -->
      <form action="./reset-password-success.html" class="space-y-5">
        <!-- New Password Input -->
        <div class="relative">
          <label class="absolute -top-2.5 left-3 bg-white px-1 text-xs text-gray-500">New Password</label>
          <input type="password" required class="w-full border border-gray-300 rounded-md px-3 py-2.5 text-sm focus:outline-none focus:border-gray-500" />
        </div>

        <!-- Confirm New Password Input -->
        <div class="relative">
          <label class="absolute -top-2.5 left-3 bg-white px-1 text-xs text-gray-500">Confirm New Password</label>
          <input type="password" required class="w-full border border-gray-300 rounded-md px-3 py-2.5 text-sm focus:outline-none focus:border-gray-500" />
        </div>

        <!-- Submit Button -->
        <button type="submit" class="w-full text-white text-center py-3.5 rounded-full font-semibold block transition-all duration-300 relative overflow-hidden backdrop-blur-md bg-[#e2156d]/70 border border-white/30 shadow-[0_8px_32px_0_rgba(226,21,109,0.37)] hover:bg-[#e2156d]/90 hover:shadow-[0_8px_32px_0_rgba(226,21,109,0.6)] hover:scale-[1.02] active:scale-[0.98] before:absolute before:inset-0 before:bg-gradient-to-br before:from-white/40 before:to-transparent before:opacity-50 pointer-events-auto">
        <span class="relative z-10">Reset Password</span>
        </button>
      </form>

    </div>
  </main>

  <!-- FOOTER -->
  <footer class="bg-accent text-white">
    <div class="max-w-6xl w-full mx-auto px-4 py-8">
      <div class="border-t border-white/20 pt-6 text-center text-xs text-white/70">
        &copy; 2026 OCCASION. All rights reserved.
      </div>
    </div>
  </footer>

</body>
</html>
