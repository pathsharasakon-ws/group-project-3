<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Article Page</title>
      <link href="https://fonts.googleapis.com/css?family=Prompt:100,200,300,400,500,600,700,800,900&display=swap"
    rel="stylesheet" />

<link rel="stylesheet" href="./output.css" />
</head>
<body>
   <header id="navbar-container"></header>
<main class="max-w-4xl mx-auto px-4 py-10">
    <nav class="flex items-center text-sm text-gray-500 mb-6 gap-2 p-5" aria-label="Breadcrumb">
        <a href="./index.html" class="hover:text-primary transition-colors flex items-center gap-1">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
          </svg>
          <span>หน้าแรก</span>
        </a>
        <span>/</span>
        <span class="text-primary font-medium"  id="article-title-path"></span>
      </nav>
  <!-- 1. Header บทความ + Metadata -->
  <header class="text-center mb-8 mt-4">
    <span class="text-xs font-bold uppercase tracking-wider text-pink-500 bg-pink-50 px-3 py-5 rounded-full" id="article-category">
    </span>
    <h1 class="text-3xl sm:text-4xl font-extrabold text-gray-900 mt-4 leading-tight" id="article-title">
    </h1>
    
    <div class="flex items-center justify-center gap-3 text-sm text-gray-500">
      <span id="article-author">โดย</span> • <span id="article-date"></span> • <span>อ่าน 3 นาที</span>
    </div>
  </header>

  <!-- 2. รูปปกบทความ (Cover Image) -->
<!-- Wrapper หลักคุมความกว้างทั้งรูปภาพและเนื้อหาให้ตรงกันเป๊ะ -->
<div class="max-w-3xl mx-auto px-4">

  <!-- 1. รูปภาพปก (ขอบจะตรงกับเนื้อหาด้านล่างพอดี) -->
  <div class="w-full aspect-video rounded-2xl overflow-hidden shadow-sm mb-8">
    <img src="" alt="Cover" class="w-full h-full object-cover" id="article-image"/>
  </div>

  <!-- 2. โครงสร้างเนื้อหา + ปุ่มแชร์ -->
  <div class="grid grid-cols-1 md:grid-cols-12 gap-8 items-start">
    
    <!-- ปุ่มแชร์ (Sidebar) -->
  <aside class="md:col-span-3 flex md:flex-col items-center md:items-start gap-3">
  <span class="text-xs font-bold text-gray-500 uppercase tracking-wider">แชร์เรื่องนี้</span>
  <div class="flex md:flex-col gap-3">
    
    <!-- LINE -->
    <button class="w-10 h-10 rounded-full bg-[#06C755] text-white flex items-center justify-center hover:opacity-90 shadow-sm transition" title="แชร์ไปยัง LINE">
       <img src="./assets/icon/line.png" alt="" class="w-5 h-5 fill-current">
    </button>

    <!-- Facebook -->
    <button class="w-10 h-10 rounded-full bg-[#1877F2] text-white flex items-center justify-center hover:opacity-90 shadow-sm transition" title="แชร์ไปยัง Facebook">
      <img src="./assets/icon/facebook.png" alt="" class="w-5 h-5 fill-current">
    </button>

    <!-- Copy Link -->
    <button class="w-10 h-10 rounded-full border border-gray-300 text-gray-600 bg-white flex items-center justify-center hover:bg-gray-50 shadow-sm transition" title="คัดลอกลิงก์">
       <img src="./assets/icon/link.png" alt="" class="w-5 h-5 fill-current">
    </button>

  </div>
</aside>

    <article class="md:col-span-9 text-gray-700 text-base sm:text-lg leading-relaxed space-y-6 mb-5" id="article-content">
    </article>

  </div>
</div>

  </div>
</main>
    <div id="footer-container" ></div>

    <!-- โหลดสคริปต์ส่วนกลางสำหรับดึง navbar.html และ footer.html -->
    <script type="module" src="script.js"></script>
</body>
</html>
