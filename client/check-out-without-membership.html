<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Checkout Without Member</title>

    <!-- =========================================
         GOOGLE FONT
    ========================================= -->

    <link
      href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- =========================================
         TAILWIND CSS
    ========================================= -->

    <link rel="stylesheet" href="./output.css" />

    <style>
      /* =========================================
           PAGE LAYOUT
        ========================================= */

      html,
      body {
        margin: 0;
        padding: 0;

        min-height: 100vh;
      }

      body {
        display: flex;
        flex-direction: column;
      }

      #navbar-container {
        flex-shrink: 0;
      }

      main {
        flex: 1 0 auto;
      }

      #footer-container {
        flex-shrink: 0;
      }

      /* =========================================
           CHECKOUT PAGE
        ========================================= */

      .checkout-wrapper {
        width: 100%;
        max-width: 1100px;

        margin-left: auto;
        margin-right: auto;

        padding: 60px 80px;

        box-sizing: border-box;
      }

      /* =========================================
           CHECKOUT CONTENT
        ========================================= */

      .checkout-card {
        width: 100%;
        max-width: 700px;

        margin-left: auto;
        margin-right: auto;

        padding: 45px 80px;

        box-sizing: border-box;
      }

      /* =========================================
           TITLE
        ========================================= */

      .checkout-title {
        margin: 0 0 45px 0;

        font-size: 30px;
        font-weight: 600;

        line-height: 1.4;
      }

      /* =========================================
           SECTION
        ========================================= */

      .checkout-section {
        margin-bottom: 40px;
      }

      .checkout-section:last-child {
        margin-bottom: 0;
      }

      /* =========================================
           TEXT
        ========================================= */

      .checkout-text {
        margin: 0 0 20px 0;

        font-size: 14px;

        line-height: 1.8;

        color: #222;
      }

      .checkout-description {
        margin: 0 0 20px 0;

        font-size: 13px;

        line-height: 1.8;

        color: #333;
      }

      /* =========================================
           BUTTON
        ========================================= */

      .checkout-button {
        display: flex;

        align-items: center;
        justify-content: center;

        width: 100%;

        min-height: 50px;

        border: none;

        background-color: #000;

        color: white;

        font-family: "Prompt", sans-serif;

        font-size: 13px;

        font-weight: 500;

        cursor: pointer;

        transition: opacity 0.2s ease;
      }

      .checkout-button:hover {
        opacity: 0.8;
      }

      /* =========================================
           BENEFITS
        ========================================= */

      .benefits {
        margin: 20px 0 25px 0;

        padding: 0;

        list-style: none;
      }

      .benefits li {
        display: flex;

        align-items: flex-start;

        gap: 12px;

        margin-bottom: 12px;

        font-size: 13px;

        line-height: 1.6;
      }

      .benefits li:last-child {
        margin-bottom: 0;
      }

      .benefit-check {
        flex-shrink: 0;

        font-size: 16px;

        line-height: 1.4;
      }

      /* =========================================
           RESPONSIVE
        ========================================= */

      @media (max-width: 900px) {
        .checkout-wrapper {
          padding: 40px 30px;
        }

        .checkout-card {
          padding: 35px 45px;
        }

        .checkout-title {
          font-size: 26px;
        }
      }

      @media (max-width: 600px) {
        .checkout-wrapper {
          padding: 30px 15px;
        }

        .checkout-card {
          padding: 30px 25px;
        }

        .checkout-title {
          font-size: 24px;

          margin-bottom: 35px;
        }

        .checkout-text {
          font-size: 13px;
        }

        .checkout-description {
          font-size: 12px;
        }

        .benefits li {
          font-size: 12px;
        }
      }
    </style>
  </head>

  <body>
    <!-- =========================================
         NAVBAR
    ========================================= -->

    <header id="navbar-container"></header>

    <!-- =========================================
         MAIN
    ========================================= -->

    <main class="bg-background py-10">
      <!-- =========================================
             MAIN CHECKOUT WRAPPER

             ไม่มีพื้นหลังสีขาว
        ========================================= -->

      <div class="checkout-wrapper">
        <!-- =====================================
                 CHECKOUT CONTENT

                 ไม่มีพื้นหลังสีขาว
            ====================================== -->

        <div class="checkout-card">
          <!-- =================================
                     TITLE
                ================================== -->

          <h1 class="checkout-title">ดำเนินการชำระเงิน</h1>

          <!-- =================================
                     RETURNING CUSTOMER
                ================================== -->

          <section class="checkout-section">
            <p class="checkout-text">ลูกค้าที่กลับมาใช้บริการ</p>

            <button type="button" class="checkout-button">
              ลงชื่อเข้าใช้งาน
            </button>
          </section>

          <!-- =================================
                     NEW CUSTOMER
                ================================== -->

          <section class="checkout-section">
            <p class="checkout-text">หน้าชำระเงินสำหรับลูกค้าใหม่</p>

            <p class="checkout-description">
              สมัครสมาชิกตอนนี้ - ใช้เวลาไม่นานและฟรี!
            </p>

            <!-- =============================
                         BENEFITS
                    ============================== -->

            <ul class="benefits">
              <li>
                <span class="benefit-check"> ✓ </span>

                <span> ส่วนลด 20% สำหรับการสั่งซื้อครั้งแรกของคุณ </span>
              </li>

              <li>
                <span class="benefit-check"> ✓ </span>

                <span> เปลี่ยนสินค้าฟรีและคืนเงินภายใน 30 วัน </span>
              </li>
            </ul>

            <!-- =============================
                         REGISTER BUTTON
                    ============================== -->

           <a href="./signup.html"> <button type="button" class="checkout-button">สมัครสมาชิก</button></a>
          </section>
        </div>
      </div>
    </main>

    <!-- =========================================
         FOOTER
    ========================================= -->

    <div id="footer-container"></div>

    <!-- =========================================
         JAVASCRIPT
    ========================================= -->

    <script type="module" src="script.js"></script>
  </body>
</html>
